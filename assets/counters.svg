<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" width="900" height="110" aria-label="18+ projects, 4+ years coding, 14+ technologies" xmlns:c2pa="http://c2pa.org/manifest">
<defs><filter id="gl" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>text{font-family:"SF Mono","JetBrains Mono",Consolas,"Liberation Mono","Courier New",monospace;white-space:pre}.cv{fill:#070b09;transform-box:fill-box;transform-origin:right center;animation-name:rv;animation-fill-mode:forwards}@keyframes rv{to{transform:scaleX(0)}}.fi{opacity:0;animation:fi .01s forwards}@keyframes fi{to{opacity:1}}.bar{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:gr 1.2s ease-out forwards}@keyframes gr{to{transform:scaleX(1)}}@media (prefers-reduced-motion:reduce){.cv{display:none}.fi{opacity:1;animation:none}.bar{transform:none;animation:none}}</style>
<g transform="translate(0,0)"><rect x=".5" y=".5" width="279" height="109" rx="10" fill="#070b09" stroke="#1f2a24"/>
<text x="20" y="30" font-size="12" fill="#5c6b66"><tspan fill="#3ddc84">$</tspan> count --projects</text>
<text x="20" y="78" font-size="44" font-weight="700" fill="#3ddc84" filter="url(#gl)">18+</text>
<rect class="cv" x="16" y="38" width="140" height="48" style="animation-duration:.5s;animation-delay:0.3s;animation-timing-function:steps(3)"/>
<text class="fi" style="animation-delay:0.8s" x="20" y="98" font-size="13" fill="#d7ffe5">projects completed</text>
<rect class="bar" x="150" y="94" width="110" height="3" rx="1.5" fill="#ffb454" style="animation-delay:0.7s"/></g><g transform="translate(310,0)"><rect x=".5" y=".5" width="279" height="109" rx="10" fill="#070b09" stroke="#1f2a24"/>
<text x="20" y="30" font-size="12" fill="#5c6b66"><tspan fill="#3ddc84">$</tspan> uptime --coding</text>
<text x="20" y="78" font-size="44" font-weight="700" fill="#3ddc84" filter="url(#gl)">4+</text>
<rect class="cv" x="16" y="38" width="140" height="48" style="animation-duration:.5s;animation-delay:1.2s;animation-timing-function:steps(3)"/>
<text class="fi" style="animation-delay:1.7s" x="20" y="98" font-size="13" fill="#d7ffe5">years coding</text>
<rect class="bar" x="150" y="94" width="110" height="3" rx="1.5" fill="#ffb454" style="animation-delay:1.6s"/></g><g transform="translate(620,0)"><rect x=".5" y=".5" width="279" height="109" rx="10" fill="#070b09" stroke="#1f2a24"/>
<text x="20" y="30" font-size="12" fill="#5c6b66"><tspan fill="#3ddc84">$</tspan> ls stack | wc -l</text>
<text x="20" y="78" font-size="44" font-weight="700" fill="#3ddc84" filter="url(#gl)">14+</text>
<rect class="cv" x="16" y="38" width="140" height="48" style="animation-duration:.5s;animation-delay:2.1s;animation-timing-function:steps(3)"/>
<text class="fi" style="animation-delay:2.6s" x="20" y="98" font-size="13" fill="#d7ffe5">technologies used</text>
<rect class="bar" x="150" y="94" width="110" height="3" rx="1.5" fill="#ffb454" style="animation-delay:2.5s"/></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>